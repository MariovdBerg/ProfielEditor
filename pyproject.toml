[build-system]
requires = ["setuptools>=77"]  # 77+: license als SPDX-tekst (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "profieleditor"
version = "0.1.0"
description = "Interactieve HTML-editor voor Hydra-NL/HydraRing-profielen (.prfl)"
requires-python = ">=3.9"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [
    { name = "Dion Rovers" },
    { name = "Ilian de Snoo" },
    { name = "Mario van den Berg" },
    { name = "Claude" },
]
# prflcheck staat niet op PyPI: rechtstreeks van GitHub, vastgezet op een release
dependencies = ["prflcheck @ git+https://github.com/MariovdBerg/ProfielCheckPython.git@v2.0.0"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

# De editor draait vanuit de checkout (start_profieleditor.bat start src/app.py, met src/static/ ernaast en
# de .ini-bestanden in de hoofdmap); installeer daarom alleen 'editable': pip install -e ".[dev]"
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["app", "ahn", "identificatie", "koppeling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"
