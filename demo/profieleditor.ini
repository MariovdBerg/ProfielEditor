; Instellingen voor de demo: uitvoer van AHNProfielCreator (demotraject 44-1, Lekdijk bij Schalkwijk)
;
; Starten: sleep dit bestand op start_profieleditor.bat, of
;   start_profieleditor.bat demo\profieleditor.ini
;
; Paden gelden ten opzichte van de map van dit bestand.

[paden]
; Geschematiseerde profielen uit AHNProfielCreator (uitvoer\prfl)
prfl_map = prfl
; Het overzicht van de schematisatie dient als koppeltabel (kolommen vak, traject, bestand)
koppeltabel = prfl\schematisatie.csv
; Aangepaste profielen apart, zodat opnieuw schematiseren ze niet overschrijft
uitvoer_map = prfl_aangepast
; AHN-dwarsprofielen uit AHNProfielCreator (uitvoer\cross_lines_ahn.shp)
ahn_shapefile = cross_lines_ahn.shp

[opties]
achtervoegsel = _aangepast
versie = 4
; Leeg = automatisch herkennen: traject, vak en bestand in de koppeltabel; traject en vak_id in de shapefile
kolom_dijkvak =
kolom_profiel =
kolom_traject =
ahn_kolom_traject =
ahn_kolom_dijkvak =
ahn_kolom_profiel =
poort = 8765
