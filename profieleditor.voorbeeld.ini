; Instellingen van de Profieleditor
;
; Het voorbeeld profieleditor.voorbeeld.ini staat in git en wijst naar de testdata in tests\.
; Bij de eerste start maakt de editor daaruit profieleditor.ini (niet in git): pas de paden in
; dát bestand aan, of via "Instellingen" in de editor.
;
; Paden mogen absoluut zijn of relatief ten opzichte van de map van dit bestand.
; Aanhalingstekens zijn niet nodig, ook niet bij spaties in een pad.
; Wijzigingen via "Instellingen" in de editor worden in dit bestand bewaard.

[paden]
; Map met de .prfl-bestanden
prfl_map = tests\test_prfl_origineel
; Koppeltabel dijkvak <-> profiel (.csv of .xlsx); leeg = alle profielen in de map
koppeltabel = tests\test_koppeling.xlsx
; Map voor aangepaste profielen; leeg = dezelfde map als prfl_map
uitvoer_map = tests\test_prfl_aangepast
; PolylineZ-shapefile met AHN-dwarsprofielen voor de achtergrond (.dbf ernaast); leeg = geen
ahn_shapefile = tests\test_shapefiles\cross_lines_ahn.shp

[opties]
; Achtervoegsel van aangepaste bestanden: 34-1_145.prfl -> 34-1_145_aangepast.prfl
achtervoegsel = _aangepast
; Bestandsversie bij opslaan: 3 of 4
versie = 4
; Kolomnamen in de koppeltabel; leeg = automatisch herkennen, - = kolom niet gebruiken.
; Met een trajectkolom heet een dijkvak {traject}_{dijkvak}. Lege traject/dijkvak-cellen worden
; uit de bestandsnaam gehaald; een lege profielcel betekent: profiel ontbreekt.
kolom_dijkvak = dijkvak
kolom_profiel = profiel
kolom_traject = traject
; Kolommen in de AHN-shapefile; leeg = automatisch herkennen (zelfde namen als hierboven,
; bv. TRAJECT_ID en vak_id), - = niet gebruiken. Waarden worden exact vergeleken met traject
; en dijkvak van het profiel; een profielkolom wint van traject/dijkvak.
ahn_kolom_traject =
ahn_kolom_dijkvak =
ahn_kolom_profiel =
; Poort van de lokale server (bij bezet wordt de volgende vrije poort gebruikt)
poort = 8765
